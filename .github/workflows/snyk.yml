#      - name: Run Snyk to check the image for vulnerabilities
#       uses: snyk/actions/docker@master
#        continue-on-error: true
#        env:
#          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
#        with:
#          image: juice-shop:${{ github.sha }}
#          args: >
#            --file=Dockerfile
